<script>
(() => {
  const audio = document.getElementById("backgroundMusic");
  const playButton = document.getElementById("musicPlay");
  const status = document.getElementById("musicStatus");
  const volume = document.getElementById("musicVolume");

  // La canción debe estar en la misma carpeta que este archivo HTML.
  audio.src = "ambiente-nyeleni.mp3";
  audio.loop = true;
  audio.autoplay = true;
  audio.preload = "auto";
  audio.volume = Number(volume.value);

  function updatePlayingState(isPlaying) {
    playButton.textContent = isPlaying ? "❚❚" : "▶";
    playButton.setAttribute(
      "aria-label",
      isPlaying ? "Pausar música" : "Reproducir música"
    );
    playButton.title = isPlaying ? "Pausar" : "Reproducir";
  }

  async function startMusic() {
    try {
      await audio.play();
      updatePlayingState(true);
      status.textContent = "Reproduciendo en bucle";
    } catch (err) {
      updatePlayingState(false);
      status.textContent = "Haz clic en ▶ para activar la música";
    }
  }

  playButton.addEventListener("click", async () => {
    if (audio.paused) {
      await startMusic();
    } else {
      audio.pause();
      updatePlayingState(false);
      status.textContent = "Música en pausa";
    }
  });

  volume.addEventListener("input", () => {
    audio.volume = Number(volume.value);
  });

  audio.addEventListener("play", () => {
    updatePlayingState(true);
    status.textContent = "Reproduciendo en bucle";
  });

  audio.addEventListener("pause", () => {
    updatePlayingState(false);
    if (!audio.ended) {
      status.textContent = "Música en pausa";
    }
  });

  audio.addEventListener("error", () => {
    updatePlayingState(false);
    status.textContent = "No se encontró ambiente-nyeleni.mp3";
  });

  startMusic();
})();
</script>
</body>
</html>
